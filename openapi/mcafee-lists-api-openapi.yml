openapi: 3.2.0
info:
  title: McAfee Web Gateway Lists API
  description: McAfee Web Gateway (MWG) REST API for managing web security policies, rule sets, URL filtering lists, SSL inspection settings, and monitoring proxy traffic and statistics.
  version: '10.0'
  contact:
    name: McAfee Support
    url: https://www.mcafee.com/enterprise/en-us/support.html
  termsOfService: https://www.mcafee.com/enterprise/en-us/about/legal/terms-of-use.html
servers:
- url: https://{mwg-server}:4712/Konfigurator/REST
  description: McAfee Web Gateway Administration
  variables:
    mwg-server:
      default: your-mwg-server
      description: Hostname or IP of the MWG appliance
security:
- cookieAuth: []
tags:
- name: Lists
  description: Manage URL and IP lists used in filtering
paths:
  /lists:
    get:
      operationId: listLists
      summary: McAfee List all filtering lists
      description: Retrieve all configured lists used for URL filtering, IP blocking, media type filtering, and custom categorization.
      tags:
      - Lists
      responses:
        '200':
          description: All configured lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items:
                      $ref: '#/components/schemas/FilterList'
        '401':
          description: Not authenticated
  /lists/{listId}:
    get:
      operationId: getList
      summary: McAfee Get a specific list
      description: Retrieve the contents and configuration of a specific filtering list.
      tags:
      - Lists
      parameters:
      - $ref: '#/components/parameters/listId'
      responses:
        '200':
          description: List details and entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterListDetail'
        '401':
          description: Not authenticated
        '404':
          description: List not found
    put:
      operationId: updateList
      summary: McAfee Update a list
      description: Update the entries in a filtering list, adding or removing URLs, IPs, or other entries.
      tags:
      - Lists
      parameters:
      - $ref: '#/components/parameters/listId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterListDetail'
      responses:
        '200':
          description: List updated
        '400':
          description: Invalid list data
        '401':
          description: Not authenticated
        '404':
          description: List not found
  /lists/{listId}/entries:
    post:
      operationId: addListEntry
      summary: McAfee Add entry to a list
      description: Add a new entry (URL, IP, or other value) to a filtering list.
      tags:
      - Lists
      parameters:
      - $ref: '#/components/parameters/listId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListEntry'
      responses:
        '201':
          description: Entry added
        '400':
          description: Invalid entry
        '401':
          description: Not authenticated
        '404':
          description: List not found
components:
  schemas:
    ListEntry:
      type: object
      properties:
        value:
          type: string
          description: Entry value (URL, IP, etc.)
        description:
          type: string
          description: Optional description for the entry
    FilterList:
      type: object
      properties:
        id:
          type: string
          description: List identifier
        name:
          type: string
          description: List name
        type:
          type: string
          enum:
          - url
          - ip
          - mediaType
          - string
          - category
          description: Type of entries in the list
        entryCount:
          type: integer
          description: Number of entries in the list
    FilterListDetail:
      type: object
      properties:
        id:
          type: string
          description: List identifier
        name:
          type: string
          description: List name
        type:
          type: string
          description: List type
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ListEntry'
          description: List entries
  parameters:
    listId:
      name: listId
      in: path
      required: true
      description: Unique filtering list identifier
      schema:
        type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie obtained from the login endpoint
externalDocs:
  description: McAfee Web Gateway Product Guide
  url: https://docs.mcafee.com/bundle/web-gateway-product-guide
