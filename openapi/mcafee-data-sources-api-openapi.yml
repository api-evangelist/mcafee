openapi: 3.2.0
info:
  title: McAfee ESM Data Sources API
  description: McAfee Enterprise Security Manager (ESM) SIEM REST API for managing security events, alarms, watchlists, data sources, and executing queries against the event database for security monitoring and incident response.
  version: '11.0'
  contact:
    name: McAfee Support
    url: https://www.mcafee.com/enterprise/en-us/support.html
  termsOfService: https://www.mcafee.com/enterprise/en-us/about/legal/terms-of-use.html
servers:
- url: https://{esm-server}/rs/esm
  description: McAfee ESM Server
  variables:
    esm-server:
      default: your-esm-server
      description: Hostname or IP of the ESM server
security:
- sessionAuth: []
tags:
- name: Data Sources
  description: Manage event data sources
paths:
  /v2/dsGetDataSourceList:
    post:
      operationId: getDataSources
      summary: McAfee List data sources
      description: Retrieve all configured data sources that feed events into the ESM, including syslog sources, database connections, and agent-based sources.
      tags:
      - Data Sources
      responses:
        '200':
          description: List of data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
        '401':
          description: Not authenticated
components:
  schemas:
    DataSource:
      type: object
      properties:
        id:
          type: integer
          description: Data source ID
        name:
          type: string
          description: Data source name
        ipAddress:
          type: string
          description: IP address of the data source
        type:
          type: string
          description: Data source type
        enabled:
          type: boolean
          description: Whether the data source is enabled
        childType:
          type: string
          description: Child data source type
        zoneId:
          type: integer
          description: Zone ID
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JWTToken
      description: Session token obtained from the login endpoint
externalDocs:
  description: McAfee ESM API Reference Guide
  url: https://docs.mcafee.com/bundle/enterprise-security-manager-api-reference-guide
