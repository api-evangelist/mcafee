naftiko: 1.0.0-alpha2
info:
  label: McAfee ESM API — Alarms
  description: 'McAfee ESM API — Alarms. 3 operations. Lead operation: McAfee Acknowledge a triggered alarm. Self-contained
    Naftiko capability covering one Mcafee business surface.'
  tags:
  - Mcafee
  - Alarms
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MCAFEE_API_KEY: MCAFEE_API_KEY
capability:
  consumes:
  - type: http
    namespace: esm-alarms
    baseUri: https://{esm-server}/rs/esm
    description: McAfee ESM API — Alarms business capability. Self-contained, no shared references.
    resources:
    - name: v2-alarmAcknowledgeTriggeredAlarm
      path: /v2/alarmAcknowledgeTriggeredAlarm
      operations:
      - name: acknowledgealarm
        method: POST
        description: McAfee Acknowledge a triggered alarm
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v2-alarmDeleteTriggeredAlarm
      path: /v2/alarmDeleteTriggeredAlarm
      operations:
      - name: deletetriggeredalarm
        method: POST
        description: McAfee Delete triggered alarms
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v2-alarmGetTriggeredAlarms
      path: /v2/alarmGetTriggeredAlarms
      operations:
      - name: gettriggeredalarms
        method: POST
        description: McAfee Get triggered alarms
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: JWTToken
      value: '{{env.MCAFEE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: esm-alarms-rest
    port: 8080
    description: REST adapter for McAfee ESM API — Alarms. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v2/alarmacknowledgetriggeredalarm
      name: v2-alarmacknowledgetriggeredalarm
      description: REST surface for v2-alarmAcknowledgeTriggeredAlarm.
      operations:
      - method: POST
        name: acknowledgealarm
        description: McAfee Acknowledge a triggered alarm
        call: esm-alarms.acknowledgealarm
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/alarmdeletetriggeredalarm
      name: v2-alarmdeletetriggeredalarm
      description: REST surface for v2-alarmDeleteTriggeredAlarm.
      operations:
      - method: POST
        name: deletetriggeredalarm
        description: McAfee Delete triggered alarms
        call: esm-alarms.deletetriggeredalarm
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/alarmgettriggeredalarms
      name: v2-alarmgettriggeredalarms
      description: REST surface for v2-alarmGetTriggeredAlarms.
      operations:
      - method: POST
        name: gettriggeredalarms
        description: McAfee Get triggered alarms
        call: esm-alarms.gettriggeredalarms
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: esm-alarms-mcp
    port: 9090
    transport: http
    description: MCP adapter for McAfee ESM API — Alarms. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: mcafee-acknowledge-triggered-alarm
      description: McAfee Acknowledge a triggered alarm
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: esm-alarms.acknowledgealarm
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-delete-triggered-alarms
      description: McAfee Delete triggered alarms
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: esm-alarms.deletetriggeredalarm
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-get-triggered-alarms
      description: McAfee Get triggered alarms
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: esm-alarms.gettriggeredalarms
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
