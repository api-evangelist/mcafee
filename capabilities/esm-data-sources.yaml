naftiko: 1.0.0-alpha2
info:
  label: McAfee ESM API — Data Sources
  description: 'McAfee ESM API — Data Sources. 1 operations. Lead operation: McAfee List data sources. Self-contained Naftiko
    capability covering one Mcafee business surface.'
  tags:
  - Mcafee
  - Data Sources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MCAFEE_API_KEY: MCAFEE_API_KEY
capability:
  consumes:
  - type: http
    namespace: esm-data-sources
    baseUri: https://{esm-server}/rs/esm
    description: McAfee ESM API — Data Sources business capability. Self-contained, no shared references.
    resources:
    - name: v2-dsGetDataSourceList
      path: /v2/dsGetDataSourceList
      operations:
      - name: getdatasources
        method: POST
        description: McAfee List data sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: JWTToken
      value: '{{env.MCAFEE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: esm-data-sources-rest
    port: 8080
    description: REST adapter for McAfee ESM API — Data Sources. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v2/dsgetdatasourcelist
      name: v2-dsgetdatasourcelist
      description: REST surface for v2-dsGetDataSourceList.
      operations:
      - method: POST
        name: getdatasources
        description: McAfee List data sources
        call: esm-data-sources.getdatasources
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: esm-data-sources-mcp
    port: 9090
    transport: http
    description: MCP adapter for McAfee ESM API — Data Sources. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: mcafee-list-data-sources
      description: McAfee List data sources
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: esm-data-sources.getdatasources
      outputParameters:
      - type: object
        mapping: $.
