naftiko: 1.0.0-alpha2
info:
  label: McAfee ESM API — Events
  description: 'McAfee ESM API — Events. 2 operations. Lead operation: McAfee Execute an event query. Self-contained Naftiko
    capability covering one Mcafee business surface.'
  tags:
  - Mcafee
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MCAFEE_API_KEY: MCAFEE_API_KEY
capability:
  consumes:
  - type: http
    namespace: esm-events
    baseUri: https://{esm-server}/rs/esm
    description: McAfee ESM API — Events business capability. Self-contained, no shared references.
    resources:
    - name: v2-qryExecuteDetail
      path: /v2/qryExecuteDetail
      operations:
      - name: executequery
        method: POST
        description: McAfee Execute an event query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v2-qryGetResults
      path: /v2/qryGetResults
      operations:
      - name: getqueryresults
        method: POST
        description: McAfee Get query results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: JWTToken
      value: '{{env.MCAFEE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: esm-events-rest
    port: 8080
    description: REST adapter for McAfee ESM API — Events. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v2/qryexecutedetail
      name: v2-qryexecutedetail
      description: REST surface for v2-qryExecuteDetail.
      operations:
      - method: POST
        name: executequery
        description: McAfee Execute an event query
        call: esm-events.executequery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v2/qrygetresults
      name: v2-qrygetresults
      description: REST surface for v2-qryGetResults.
      operations:
      - method: POST
        name: getqueryresults
        description: McAfee Get query results
        call: esm-events.getqueryresults
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: esm-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for McAfee ESM API — Events. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: mcafee-execute-event-query
      description: McAfee Execute an event query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: esm-events.executequery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-get-query-results
      description: McAfee Get query results
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: esm-events.getqueryresults
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
