naftiko: 1.0.0-alpha2
info:
  label: McAfee ESM API — Devices
  description: 'McAfee ESM API — Devices. 1 operations. Lead operation: McAfee List ESM devices. Self-contained Naftiko capability
    covering one Mcafee business surface.'
  tags:
  - Mcafee
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MCAFEE_API_KEY: MCAFEE_API_KEY
capability:
  consumes:
  - type: http
    namespace: esm-devices
    baseUri: https://{esm-server}/rs/esm
    description: McAfee ESM API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: v2-devGetDeviceList
      path: /v2/devGetDeviceList
      operations:
      - name: getdevices
        method: POST
        description: McAfee List ESM devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: JWTToken
      value: '{{env.MCAFEE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: esm-devices-rest
    port: 8080
    description: REST adapter for McAfee ESM API — Devices. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v2/devgetdevicelist
      name: v2-devgetdevicelist
      description: REST surface for v2-devGetDeviceList.
      operations:
      - method: POST
        name: getdevices
        description: McAfee List ESM devices
        call: esm-devices.getdevices
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: esm-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for McAfee ESM API — Devices. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: mcafee-list-esm-devices
      description: McAfee List ESM devices
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: esm-devices.getdevices
      outputParameters:
      - type: object
        mapping: $.
