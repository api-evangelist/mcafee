naftiko: 1.0.0-alpha2
info:
  label: McAfee ePO API — Queries
  description: 'McAfee ePO API — Queries. 2 operations. Lead operation: McAfee Execute a saved query. Self-contained Naftiko
    capability covering one Mcafee business surface.'
  tags:
  - Mcafee
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MCAFEE_API_KEY: MCAFEE_API_KEY
capability:
  consumes:
  - type: http
    namespace: epo-queries
    baseUri: https://{epo-server}:8443/remote
    description: McAfee ePO API — Queries business capability. Self-contained, no shared references.
    resources:
    - name: core.executeQuery
      path: /core.executeQuery
      operations:
      - name: coreexecutequery
        method: GET
        description: McAfee Execute a saved query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: queryId
          in: query
          type: integer
          description: ID of the saved query to execute
          required: true
    - name: core.listQueries
      path: /core.listQueries
      operations:
      - name: corelistqueries
        method: GET
        description: McAfee List saved queries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.MCAFEE_USER}}'
      password: '{{env.MCAFEE_PASS}}'
  exposes:
  - type: rest
    namespace: epo-queries-rest
    port: 8080
    description: REST adapter for McAfee ePO API — Queries. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/core-executequery
      name: core-executequery
      description: REST surface for core.executeQuery.
      operations:
      - method: GET
        name: coreexecutequery
        description: McAfee Execute a saved query
        call: epo-queries.coreexecutequery
        with:
          queryId: rest.queryId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/core-listqueries
      name: core-listqueries
      description: REST surface for core.listQueries.
      operations:
      - method: GET
        name: corelistqueries
        description: McAfee List saved queries
        call: epo-queries.corelistqueries
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: epo-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for McAfee ePO API — Queries. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: mcafee-execute-saved-query
      description: McAfee Execute a saved query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: epo-queries.coreexecutequery
      with:
        queryId: tools.queryId
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-list-saved-queries
      description: McAfee List saved queries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: epo-queries.corelistqueries
      outputParameters:
      - type: object
        mapping: $.
