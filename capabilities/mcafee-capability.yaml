      path: /system.applyTag
      operations:
      - name: systemapplytag
        method: POST
        description: McAfee Apply a tag to systems
        inputParameters:
        - name: names
          in: query
          type: string
          required: true
          description: Comma-separated list of system names or IDs
        - name: tagName
          in: query
          type: string
          required: true
          description: Name of the tag to apply
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
