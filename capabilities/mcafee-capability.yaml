      path: /system.clearTag
      operations:
      - name: systemcleartag
        method: POST
        description: McAfee Remove a tag from systems
        inputParameters:
        - name: names
          in: query
          type: string
          required: true
          description: Comma-separated list of system names or IDs
        - name: tagName
          in: query
          type: string
          required: true
          description: Name of the tag to remove
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
