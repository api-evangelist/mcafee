    port: 9090
    transport: http
    description: MCP adapter for McAfee ESM API — Watchlists. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: mcafee-add-values-watchlist
      description: McAfee Add values to a watchlist
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: esm-watchlists.addwatchlistvalues
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-get-watchlist-values
      description: McAfee Get watchlist values
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: esm-watchlists.getwatchlistvalues
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-list-watchlists
      description: McAfee List watchlists
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: esm-watchlists.getwatchlists
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-remove-values-watchlist
      description: McAfee Remove values from a watchlist
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: esm-watchlists.removewatchlistvalues
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
