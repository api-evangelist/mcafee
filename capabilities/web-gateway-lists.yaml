naftiko: 1.0.0-alpha2
info:
  label: McAfee Web Gateway API — Lists
  description: 'McAfee Web Gateway API — Lists. 4 operations. Lead operation: McAfee List all filtering lists. Self-contained
    Naftiko capability covering one Mcafee business surface.'
  tags:
  - Mcafee
  - Lists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MCAFEE_API_KEY: MCAFEE_API_KEY
capability:
  consumes:
  - type: http
    namespace: web-gateway-lists
    baseUri: https://{mwg-server}:4712/Konfigurator/REST
    description: McAfee Web Gateway API — Lists business capability. Self-contained, no shared references.
    resources:
    - name: lists
      path: /lists
      operations:
      - name: listlists
        method: GET
        description: McAfee List all filtering lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lists-listId
      path: /lists/{listId}
      operations:
      - name: getlist
        method: GET
        description: McAfee Get a specific list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatelist
        method: PUT
        description: McAfee Update a list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: lists-listId-entries
      path: /lists/{listId}/entries
      operations:
      - name: addlistentry
        method: POST
        description: McAfee Add entry to a list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: JSESSIONID
      value: '{{env.MCAFEE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: web-gateway-lists-rest
    port: 8080
    description: REST adapter for McAfee Web Gateway API — Lists. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/lists
      name: lists
      description: REST surface for lists.
      operations:
      - method: GET
        name: listlists
        description: McAfee List all filtering lists
        call: web-gateway-lists.listlists
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lists/{listid}
      name: lists-listid
      description: REST surface for lists-listId.
      operations:
      - method: GET
        name: getlist
        description: McAfee Get a specific list
        call: web-gateway-lists.getlist
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatelist
        description: McAfee Update a list
        call: web-gateway-lists.updatelist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lists/{listid}/entries
      name: lists-listid-entries
      description: REST surface for lists-listId-entries.
      operations:
      - method: POST
        name: addlistentry
        description: McAfee Add entry to a list
        call: web-gateway-lists.addlistentry
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: web-gateway-lists-mcp
    port: 9090
    transport: http
    description: MCP adapter for McAfee Web Gateway API — Lists. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: mcafee-list-all-filtering-lists
      description: McAfee List all filtering lists
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: web-gateway-lists.listlists
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-get-specific-list
      description: McAfee Get a specific list
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: web-gateway-lists.getlist
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-update-list
      description: McAfee Update a list
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: web-gateway-lists.updatelist
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-add-entry-list
      description: McAfee Add entry to a list
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: web-gateway-lists.addlistentry
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
