    port: 9090
    transport: http
    description: MCP adapter for McAfee Web Gateway API — Rule Sets. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: mcafee-list-rule-sets
      description: McAfee List rule sets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: web-gateway-rule-sets.listrulesets
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-get-specific-rule-set
      description: McAfee Get a specific rule set
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: web-gateway-rule-sets.getruleset
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-update-rule-set
      description: McAfee Update a rule set
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: web-gateway-rule-sets.updateruleset
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mcafee-delete-rule-set
      description: McAfee Delete a rule set
      hints:
